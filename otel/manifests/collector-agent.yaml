apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: agent
  namespace: otel
spec:
  mode: daemonset
  image: otel/opentelemetry-collector-contrib:0.110.0
  serviceAccount: otel-collector
  env:
    - name: ELASTIC_PASSWORD
      valueFrom:
        secretKeyRef:
          name: scraper-es-elastic-user
          key: elastic
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 300m, memory: 256Mi }
  tolerations:
    - effect: NoSchedule
      operator: Exists
  volumeMounts:
    - name: varlog
      mountPath: /var/log
      readOnly: true
    - name: varlibdockercontainers
      mountPath: /var/lib/docker/containers
      readOnly: true
  volumes:
    - name: varlog
      hostPath: { path: /var/log }
    - name: varlibdockercontainers
      hostPath: { path: /var/lib/docker/containers }
  config:
    receivers:
      filelog:
        include:
          - /var/log/pods/ml-scraper_*/*/*.log
        start_at: end
        include_file_path: true
        include_file_name: false
        operators:
          - type: container
            id: container-parser
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    processors:
      batch:
        timeout: 10s
        send_batch_size: 1024
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.cronjob.name
            - k8s.job.name
            - k8s.node.name
          labels:
            - tag_name: app
              key: app
              from: pod
            - tag_name: component
              key: app.kubernetes.io/component
              from: pod
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection
      attributes:
        actions:
          - key: service
            from_attribute: app
            action: insert
      transform:
        log_statements:
          - context: log
            statements:
              - 'set(attributes["log_id"], UUID()) where attributes["log_id"] == nil'
    exporters:
      otlphttp/loki:
        endpoint: http://loki.observability.svc.cluster.local:3100/otlp
      elasticsearch:
        endpoints:
          - https://scraper-es-http.elastic.svc.cluster.local:9200
        user: elastic
        password: ${env:ELASTIC_PASSWORD}
        tls:
          insecure_skip_verify: true
        logs_index: scraper-logs-v2
        mapping:
          mode: ecs
      otlp/jaeger:
        endpoint: jaeger-collector.otel.svc.cluster.local:4317
        tls:
          insecure: true
    service:
      pipelines:
        logs:
          receivers: [filelog, otlp]
          processors: [k8sattributes, attributes, transform, batch]
          exporters: [otlphttp/loki, elasticsearch]
        traces:
          receivers: [otlp]
          processors: [k8sattributes, batch]
          exporters: [otlp/jaeger]
      telemetry:
        logs:
          level: info